<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Recovery is part of the evidence story</title>
  <desc id="desc">A timeline from error or deterioration through recognition, response, recovery and result, with assessment callouts.</desc>
  <rect width="1600" height="900" fill="#f7f9fc"/>
  <rect x="70" y="60" width="1460" height="780" rx="28" fill="#ffffff" stroke="#d7e0ef" stroke-width="3"/>
  <text x="130" y="145" fill="#092c73" font-family="Arial, sans-serif" font-size="52" font-weight="700">Recovery is part of the evidence story</text>
  <text x="130" y="195" fill="#53627a" font-family="Arial, sans-serif" font-size="27">Assess the full sequence — recovery adds evidence; it does not erase the event.</text>
  <line x1="210" y1="385" x2="1390" y2="385" stroke="#092c73" stroke-width="10"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <circle cx="250" cy="385" r="42" fill="#e8000b"/><text x="250" y="400" fill="#ffffff" font-size="26" font-weight="700">1</text>
    <circle cx="535" cy="385" r="42" fill="#092c73"/><text x="535" y="400" fill="#ffffff" font-size="26" font-weight="700">2</text>
    <circle cx="820" cy="385" r="42" fill="#092c73"/><text x="820" y="400" fill="#ffffff" font-size="26" font-weight="700">3</text>
    <circle cx="1105" cy="385" r="42" fill="#092c73"/><text x="1105" y="400" fill="#ffffff" font-size="26" font-weight="700">4</text>
    <circle cx="1390" cy="385" r="42" fill="#e29335"/><text x="1390" y="400" fill="#ffffff" font-size="26" font-weight="700">5</text>
    <text x="250" y="300" fill="#a60008" font-size="30" font-weight="700">Error /</text><text x="250" y="335" fill="#a60008" font-size="30" font-weight="700">deterioration</text>
    <text x="535" y="300" fill="#092c73" font-size="30" font-weight="700">Recognition</text>
    <text x="820" y="300" fill="#092c73" font-size="30" font-weight="700">Response</text>
    <text x="1105" y="300" fill="#092c73" font-size="30" font-weight="700">Recovery</text>
    <text x="1390" y="300" fill="#80510e" font-size="30" font-weight="700">Result</text>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle" font-size="24" fill="#263b5b">
    <text x="360" y="545">severity</text><text x="590" y="545">recognition time</text><text x="820" y="545">independence</text><text x="1060" y="545">corrective action</text><text x="1290" y="545">safety margin</text>
  </g>
  <rect x="260" y="640" width="1080" height="100" rx="18" fill="#092c73"/>
  <text x="800" y="703" fill="#ffffff" font-family="Arial, sans-serif" font-size="35" font-weight="700" text-anchor="middle">Strong recovery may demonstrate competence — but the original event remains evidence.</text>
</svg>
