<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Evidence versus interpretation versus conclusion</title>
  <desc id="desc">Three panels separate observable evidence from interpretation and assessment conclusion, which reconnects to the standard.</desc>
  <rect width="1600" height="900" fill="#f7f9fc"/>
  <rect x="70" y="60" width="1460" height="780" rx="28" fill="#ffffff" stroke="#d7e0ef" stroke-width="3"/>
  <text x="130" y="145" fill="#092c73" font-family="Arial, sans-serif" font-size="52" font-weight="700">Evidence vs interpretation vs conclusion</text>
  <text x="130" y="195" fill="#53627a" font-family="Arial, sans-serif" font-size="27">Write what happened before explaining what it means.</text>
  <g font-family="Arial, sans-serif">
    <rect x="145" y="300" width="380" height="310" rx="20" fill="#eaf0fb" stroke="#092c73" stroke-width="4"/>
    <rect x="610" y="300" width="380" height="310" rx="20" fill="#fff4e8" stroke="#e29335" stroke-width="4"/>
    <rect x="1075" y="300" width="380" height="310" rx="20" fill="#fff0f1" stroke="#e8000b" stroke-width="4"/>
    <text x="335" y="370" fill="#092c73" font-size="36" font-weight="700" text-anchor="middle">Observable evidence</text>
    <text x="800" y="370" fill="#80510e" font-size="36" font-weight="700" text-anchor="middle">Interpretation</text>
    <text x="1265" y="370" fill="#a60008" font-size="36" font-weight="700" text-anchor="middle">Assessment conclusion</text>
    <text x="190" y="435" fill="#263b5b" font-size="25">“Missed two radio calls;</text><text x="190" y="472" fill="#263b5b" font-size="25">omitted checklist;</text><text x="190" y="509" fill="#263b5b" font-size="25">altitude deviation.”</text>
    <text x="655" y="435" fill="#80510e" font-size="25">“Workload management</text><text x="655" y="472" fill="#80510e" font-size="25">deteriorated.”</text>
    <text x="1120" y="435" fill="#a60008" font-size="25">“Compare the evidence</text><text x="1120" y="472" fill="#a60008" font-size="25">with the required</text><text x="1120" y="509" fill="#a60008" font-size="25">competency/standard</text><text x="1120" y="546" fill="#a60008" font-size="25">before deciding.”</text>
  </g>
  <text x="565" y="455" fill="#e8000b" font-family="Arial, sans-serif" font-size="55" font-weight="700">→</text><text x="1030" y="455" fill="#e8000b" font-family="Arial, sans-serif" font-size="55" font-weight="700">→</text>
  <text x="800" y="730" fill="#092c73" font-family="Arial, sans-serif" font-size="31" font-weight="700" text-anchor="middle">Concise observations make later professional reasoning reconstructable.</text>
</svg>
