<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Examiner drift and the return to the shared standard</title>
  <desc id="desc">A gradual path from shared standard through routine and adaptations to examiner drift, with review and calibration returning to the shared standard.</desc>
  <rect width="1600" height="900" fill="#f7f9fc"/>
  <rect x="70" y="60" width="1460" height="780" rx="28" fill="#ffffff" stroke="#d7e0ef" stroke-width="3"/>
  <text x="130" y="145" fill="#092c73" font-family="Arial, sans-serif" font-size="52" font-weight="700">Examiner drift — how it develops</text>
  <text x="130" y="195" fill="#53627a" font-family="Arial, sans-serif" font-size="27">A normal professional risk requiring self-recognition and calibration.</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="120" y="310" width="230" height="125" rx="18" fill="#eaf0fb" stroke="#092c73" stroke-width="3"/>
    <text x="235" y="385" fill="#092c73" font-size="29" font-weight="700">Shared standard</text>
    <text x="390" y="375" fill="#e8000b" font-size="52">→</text>
    <rect x="435" y="310" width="210" height="125" rx="18" fill="#f1f4f9" stroke="#8090a8" stroke-width="3"/>
    <text x="540" y="365" fill="#263b5b" font-size="29" font-weight="700">Repeated</text>
    <text x="540" y="400" fill="#263b5b" font-size="29" font-weight="700">practice</text>
    <text x="685" y="375" fill="#e8000b" font-size="52">→</text>
    <rect x="730" y="310" width="235" height="125" rx="18" fill="#fff4e8" stroke="#e29335" stroke-width="3"/>
    <text x="847" y="365" fill="#80510e" font-size="27" font-weight="700">Small personal</text>
    <text x="847" y="400" fill="#80510e" font-size="27" font-weight="700">adaptations</text>
    <text x="1005" y="375" fill="#e8000b" font-size="52">→</text>
    <rect x="1050" y="310" width="190" height="125" rx="18" fill="#fff4e8" stroke="#e29335" stroke-width="3"/>
    <text x="1145" y="365" fill="#80510e" font-size="29" font-weight="700">Local</text>
    <text x="1145" y="400" fill="#80510e" font-size="29" font-weight="700">normalisation</text>
    <text x="1280" y="375" fill="#e8000b" font-size="52">→</text>
    <rect x="1325" y="310" width="150" height="125" rx="18" fill="#fff0f1" stroke="#e8000b" stroke-width="3"/>
    <text x="1400" y="365" fill="#a60008" font-size="27" font-weight="700">Examiner</text>
    <text x="1400" y="400" fill="#a60008" font-size="27" font-weight="700">drift</text>
  </g>
  <path d="M1400 470 C1400 650 1150 735 800 735 C460 735 260 650 235 475" fill="none" stroke="#092c73" stroke-width="8" stroke-dasharray="18 14"/>
  <polygon points="220,470 250,490 225,515" fill="#092c73"/>
  <rect x="520" y="605" width="560" height="90" rx="18" fill="#eaf0fb" stroke="#092c73" stroke-width="3"/>
  <text x="800" y="660" fill="#092c73" font-family="Arial, sans-serif" font-size="31" font-weight="700" text-anchor="middle">Review + calibration → shared standard</text>
  <text x="800" y="790" fill="#a60008" font-family="Arial, sans-serif" font-size="29" font-weight="700" text-anchor="middle">Experience should improve application of the standard — not become a substitute for it.</text>
</svg>
