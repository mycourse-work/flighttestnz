<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">From behaviour to assessment decision</title>
  <desc id="desc">A six-stage reasoning path from observation through context, recognition and management, pattern and standard to conclusion.</desc>
  <rect width="1600" height="900" fill="#f7f9fc"/>
  <rect x="70" y="60" width="1460" height="780" rx="28" fill="#ffffff" stroke="#d7e0ef" stroke-width="3"/>
  <text x="130" y="145" fill="#092c73" font-family="Arial, sans-serif" font-size="52" font-weight="700">From behaviour to assessment decision</text>
  <text x="130" y="195" fill="#53627a" font-family="Arial, sans-serif" font-size="27">Use disciplined questions; do not jump from one observation to a conclusion.</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="115" y="315" width="190" height="125" rx="16" fill="#eaf0fb" stroke="#092c73" stroke-width="3"/><text x="210" y="390" fill="#092c73" font-size="31" font-weight="700">Observation</text>
    <text x="335" y="380" fill="#e8000b" font-size="46">→</text>
    <rect x="370" y="315" width="180" height="125" rx="16" fill="#eaf0fb" stroke="#092c73" stroke-width="3"/><text x="460" y="390" fill="#092c73" font-size="31" font-weight="700">Context</text>
    <text x="580" y="380" fill="#e8000b" font-size="46">→</text>
    <rect x="615" y="315" width="250" height="125" rx="16" fill="#eaf0fb" stroke="#092c73" stroke-width="3"/><text x="740" y="365" fill="#092c73" font-size="27" font-weight="700">Recognition /</text><text x="740" y="402" fill="#092c73" font-size="27" font-weight="700">management</text>
    <text x="895" y="380" fill="#e8000b" font-size="46">→</text>
    <rect x="930" y="315" width="170" height="125" rx="16" fill="#fff4e8" stroke="#e29335" stroke-width="3"/><text x="1015" y="390" fill="#80510e" font-size="31" font-weight="700">Pattern</text>
    <text x="1130" y="380" fill="#e8000b" font-size="46">→</text>
    <rect x="1165" y="315" width="170" height="125" rx="16" fill="#eaf0fb" stroke="#092c73" stroke-width="3"/><text x="1250" y="390" fill="#092c73" font-size="31" font-weight="700">Standard</text>
    <text x="1365" y="380" fill="#e8000b" font-size="46">→</text>
    <rect x="1400" y="315" width="100" height="125" rx="16" fill="#fff0f1" stroke="#e8000b" stroke-width="3"/><text x="1450" y="365" fill="#a60008" font-size="25" font-weight="700">Con-</text><text x="1450" y="400" fill="#a60008" font-size="25" font-weight="700">clusion</text>
  </g>
  <rect x="260" y="555" width="1080" height="145" rx="22" fill="#092c73"/>
  <text x="800" y="640" fill="#ffffff" font-family="Arial, sans-serif" font-size="47" font-weight="700" text-anchor="middle">Behaviour is observable. Competence is inferred.</text>
  <text x="800" y="770" fill="#53627a" font-family="Arial, sans-serif" font-size="27" text-anchor="middle">The stages are disciplined questions, not a rigid mechanical algorithm.</text>
</svg>
