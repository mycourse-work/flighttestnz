<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Examiner drift and the return to the shared standard</title>
  <desc id="desc">A gradual path from shared standard through routine and adaptations to examiner drift, with review and calibration returning to the shared standard.</desc>
  <rect width="1600" height="900" fill="#f7f9fc"/>
  <rect x="70" y="60" width="1460" height="780" rx="28" fill="#ffffff" stroke="#d7e0ef" stroke-width="3"/>
  <text x="130" y="145" fill="#092c73" font-family="Arial, sans-serif" font-size="52" font-weight="700">Examiner drift — how it develops</text>
  <text x="130" y="195" fill="#53627a" font-family="Arial, sans-serif" font-size="27">A normal professional risk requiring self-recognition and calibration.</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="90" y="310" width="230" height="125" rx="18" fill="#eaf0fb" stroke="#092c73" stroke-width="3"/>
    <text x="205" y="385" fill="#092c73" font-size="26" font-weight="700">Shared standard</text>
    <text x="345" y="375" fill="#e8000b" font-size="46">→</text>
    <rect x="380" y="310" width="220" height="125" rx="18" fill="#f1f4f9" stroke="#8090a8" stroke-width="3"/>
    <text x="490" y="365" fill="#263b5b" font-size="26" font-weight="700">Repeated</text>
    <text x="490" y="400" fill="#263b5b" font-size="26" font-weight="700">practice</text>
    <text x="625" y="375" fill="#e8000b" font-size="46">→</text>
    <rect x="660" y="310" width="250" height="125" rx="18" fill="#fff4e8" stroke="#e29335" stroke-width="3"/>
    <text x="785" y="365" fill="#80510e" font-size="25" font-weight="700">Small personal</text>
    <text x="785" y="400" fill="#80510e" font-size="25" font-weight="700">adaptations</text>
    <text x="935" y="375" fill="#e8000b" font-size="46">→</text>
    <rect x="970" y="310" width="240" height="125" rx="18" fill="#fff4e8" stroke="#e29335" stroke-width="3"/>
    <text x="1090" y="365" fill="#80510e" font-size="25" font-weight="700">Local</text>
    <text x="1090" y="400" fill="#80510e" font-size="25" font-weight="700">normalisation</text>
    <text x="1235" y="375" fill="#e8000b" font-size="46">→</text>
    <rect x="1270" y="310" width="240" height="125" rx="18" fill="#fff0f1" stroke="#e8000b" stroke-width="3"/>
    <text x="1390" y="365" fill="#a60008" font-size="26" font-weight="700">Examiner</text>
    <text x="1390" y="400" fill="#a60008" font-size="26" font-weight="700">drift</text>
  </g>
  <path d="M1390 470 C1390 665 1150 745 800 745 C450 745 230 660 205 475" fill="none" stroke="#092c73" stroke-width="8" stroke-dasharray="18 14"/>
  <polygon points="190,470 220,490 195,515" fill="#092c73"/>
  <rect x="450" y="585" width="700" height="115" rx="18" fill="#eaf0fb" stroke="#092c73" stroke-width="3"/>
  <text x="800" y="632" fill="#092c73" font-family="Arial, sans-serif" font-size="29" font-weight="700" text-anchor="middle">Review + recalibrate</text>
  <text x="800" y="673" fill="#092c73" font-family="Arial, sans-serif" font-size="29" font-weight="700" text-anchor="middle">Return to the shared standard</text>
  <text x="800" y="790" fill="#a60008" font-family="Arial, sans-serif" font-size="29" font-weight="700" text-anchor="middle">Experience should improve application of the standard — not become a substitute for it.</text>
</svg>
